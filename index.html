<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 20px; text-align: center; }
    button { padding: 15px; background: #0088cc; color: white; border: none; border-radius: 10px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Привет из Telegram Mini App!</h1>
  <p id="user-info">Загружаю данные пользователя...</p>
  <button id="send-data">Отправить данные боту</button>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); // Инициализация
    tg.expand(); // Растянуть на весь экран

    // Получаем данные пользователя
    const user = tg.initDataUnsafe.user;
    document.getElementById('user-info').innerText = 
      `Привет, ${user?.first_name || 'пользователь'}! Твой ID: ${user?.id || 'неизвестен'}`;

    // Кнопка для отправки данных боту
    document.getElementById('send-data').onclick = () => {
      tg.sendData('Привет от Mini App!'); // Отправляем данные боту
      tg.close(); // Закрываем приложение
    };
  </script>
</body>
</html>
